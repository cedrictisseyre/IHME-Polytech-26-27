services:
  app:
    build:
      context: .
      args:
        APP_BASE_PATH: ${APP_BASE_PATH:-}
    image: diagnostic-polytech:local
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_BASE_PATH: ${APP_BASE_PATH:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:?Configurez .env}:${POSTGRES_PASSWORD:?Configurez .env}@db:5432/${POSTGRES_DB:?Configurez .env}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-43187}:3000"
    depends_on:
      db:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Configurez .env}
      POSTGRES_USER: ${POSTGRES_USER:?Configurez .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configurez .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true
volumes:
  postgres_data:
